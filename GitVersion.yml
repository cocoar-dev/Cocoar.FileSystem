mode: ContinuousDeployment
branches:
  main:
    tag: stable
    increment: Patch
    is-mainline: true
  develop:
    tag: alpha
    increment: Minor
    is-mainline: false
  feature:
    tag: beta
    increment: Minor
    is-mainline: false
  hotfix:
    tag: hotfix
    increment: Patch
    is-mainline: false
  pull-request:
    tag: pr
    increment: Patch
    tag-number-pattern: '[/-](?<number>\d+)'
ignore:
  sha: []
merge-message-formats: {}
